<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Shadow -->
  <ellipse cx="60" cy="110" rx="32" ry="9" fill="#5C4533" opacity="0.2"/>

  <!-- Cat Tail Wrapped Around -->
  <path d="M 80,95 Q 95,95 90,80 Q 85,75 80,85 Z" fill="#FFAAA6" stroke="#5E432E" stroke-width="2.5"/>

  <!-- Sitting Body & Hind Legs -->
  <ellipse cx="42" cy="98" rx="12" ry="8" fill="#FFB7B2" stroke="#5E432E" stroke-width="2.5"/>
  <ellipse cx="78" cy="98" rx="12" ry="8" fill="#FFB7B2" stroke="#5E432E" stroke-width="2.5"/>
  <path d="M 36,65 Q 32,98 60,100 Q 88,98 84,65 Z" fill="#FFB7B2" stroke="#5E432E" stroke-width="2.5"/>
  <ellipse cx="60" cy="85" rx="14" ry="12" fill="#FFFFFF"/>

  <!-- Head Slightly Tilted Forward (Studying) -->
  <ellipse cx="60" cy="46" rx="34" ry="27" fill="#FFB7B2" stroke="#5E432E" stroke-width="2.5"/>

  <!-- Ears -->
  <path d="M 34,30 L 26,8 L 48,20 Z" fill="#FFB7B2" stroke="#5E432E" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 34,26 L 30,14 L 44,21 Z" fill="#FF8A80"/>
  <path d="M 86,30 L 94,8 L 72,20 Z" fill="#FFB7B2" stroke="#5E432E" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 86,26 L 90,14 L 76,21 Z" fill="#FF8A80"/>

  <!-- Whiskers -->
  <line x1="22" y1="46" x2="10" y2="44" stroke="#5E432E" stroke-width="1.5"/>
  <line x1="22" y1="50" x2="10" y2="52" stroke="#5E432E" stroke-width="1.5"/>
  <line x1="98" y1="46" x2="110" y2="44" stroke="#5E432E" stroke-width="1.5"/>
  <line x1="98" y1="50" x2="110" y2="52" stroke="#5E432E" stroke-width="1.5"/>

  <!-- Focused Eyes Looking Down at Book -->
  <ellipse cx="48" cy="46" rx="4.5" ry="5.5" fill="#2C1810"/>
  <circle cx="47" cy="45" r="1.8" fill="#FFFFFF"/>
  <ellipse cx="72" cy="46" rx="4.5" ry="5.5" fill="#2C1810"/>
  <circle cx="71" cy="45" r="1.8" fill="#FFFFFF"/>

  <ellipse cx="38" cy="50" rx="5" ry="3" fill="#FF5252" opacity="0.4"/>
  <ellipse cx="82" cy="50" rx="5" ry="3" fill="#FF5252" opacity="0.4"/>
  <polygon points="58,49 62,49 60,52" fill="#D81B60"/>
  <path d="M 57,52 Q 60,54 63,52" fill="none" stroke="#5E432E" stroke-width="1.5"/>

  <!-- STUDY BOOK HELD IN PAWS -->
  <g id="reading-book" transform="translate(40, 72)">
    <!-- Book Cover (Cute Blue Law Book) -->
    <path d="M 0,22 L 20,12 L 40,22 L 20,30 Z" fill="#4FC3F7" stroke="#0288D1" stroke-width="2"/>
    <!-- Pages -->
    <path d="M 2,21 L 20,13 L 38,21 L 20,28 Z" fill="#FFFFFF" stroke="#5E432E" stroke-width="1"/>
    <line x1="20" y1="13" x2="20" y2="28" stroke="#0288D1" stroke-width="1.5"/>
    <line x1="8" y1="19" x2="16" y2="15" stroke="#90CAF9" stroke-width="1"/>
    <line x1="24" y1="15" x2="32" y2="19" stroke="#90CAF9" stroke-width="1"/>
    <!-- Little paws on book edges -->
    <circle cx="2" cy="20" r="4.5" fill="#FFFFFF" stroke="#5E432E" stroke-width="1.5"/>
    <circle cx="38" cy="20" r="4.5" fill="#FFFFFF" stroke="#5E432E" stroke-width="1.5"/>
  </g>

  <!-- Little Nerd Reading Glasses -->
  <circle cx="48" cy="46" r="8" fill="none" stroke="#E91E63" stroke-width="1.8"/>
  <circle cx="72" cy="46" r="8" fill="none" stroke="#E91E63" stroke-width="1.8"/>
  <line x1="56" y1="46" x2="64" y2="46" stroke="#E91E63" stroke-width="2"/>
</svg>
