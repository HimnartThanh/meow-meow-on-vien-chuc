<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <!-- Shadow -->
  <ellipse cx="60" cy="78" rx="42" ry="14" fill="#5C4533" opacity="0.2"/>

  <!-- Curled Sleeping Body (Bean shape) -->
  <path d="M 35,50 C 20,60 20,80 45,82 C 75,85 95,75 92,55 C 90,40 70,35 50,42 Z" fill="#FFB7B2" stroke="#5E432E" stroke-width="2.5"/>
  <!-- White Fur Belly patch -->
  <ellipse cx="56" cy="62" rx="16" ry="10" fill="#FFFFFF"/>

  <!-- Tail curled around paws -->
  <path d="M 90,65 Q 98,75 80,78 Q 65,80 55,78" fill="none" stroke="#5E432E" stroke-width="3" stroke-linecap="round"/>
  <circle cx="53" cy="78" r="3.5" fill="#FFFFFF"/>

  <!-- Sleeping Head tucked in -->
  <ellipse cx="40" cy="52" rx="20" ry="16" fill="#FFB7B2" stroke="#5E432E" stroke-width="2.5"/>
  
  <!-- Ears flattened peacefully -->
  <path d="M 28,42 L 20,32 L 34,36 Z" fill="#FFB7B2" stroke="#5E432E" stroke-width="2"/>
  <path d="M 28,40 L 23,34 L 32,37 Z" fill="#FF8A80"/>
  
  <!-- Sleeping Closed Happy Eyes (Curved lines ^^) -->
  <path d="M 30,52 Q 35,56 40,52" fill="none" stroke="#5E432E" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="32" cy="57" rx="3.5" ry="2" fill="#FF5252" opacity="0.4"/>
  <polygon points="44,53 47,53 45,55" fill="#D81B60"/>

  <!-- Paws tucked under chin -->
  <circle cx="48" cy="62" r="4.5" fill="#FFFFFF" stroke="#5E432E" stroke-width="1.5"/>

  <!-- Floating Zzz Bubbles -->
  <g id="zzz-bubbles" fill="#FF80AB" font-family="'Nunito', sans-serif" font-weight="900">
    <text x="68" y="38" font-size="12" opacity="0.7">z</text>
    <text x="78" y="26" font-size="15" opacity="0.85">Z</text>
    <text x="90" y="14" font-size="18" opacity="0.95">Z</text>
  </g>
</svg>
