<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Shadow -->
  <ellipse cx="60" cy="108" rx="34" ry="10" fill="#5C4533" opacity="0.2"/>

  <!-- Chubby Sitting Mochi Body -->
  <ellipse cx="60" cy="78" rx="36" ry="30" fill="#FEEAA8" stroke="#5E432E" stroke-width="2.5"/>
  <ellipse cx="60" cy="85" rx="20" ry="18" fill="#FFFFFF"/>

  <!-- Feet sticking forward cutely -->
  <ellipse cx="38" cy="98" rx="7" ry="5" fill="#FFAAA6" stroke="#5E432E" stroke-width="1.8"/>
  <ellipse cx="82" cy="98" rx="7" ry="5" fill="#FFAAA6" stroke="#5E432E" stroke-width="1.8"/>

  <!-- Ears -->
  <circle cx="34" cy="48" r="9" fill="#B3845C" stroke="#5E432E" stroke-width="2"/>
  <circle cx="34" cy="48" r="5" fill="#FF8A80"/>
  <circle cx="86" cy="48" r="9" fill="#B3845C" stroke="#5E432E" stroke-width="2"/>
  <circle cx="86" cy="48" r="5" fill="#FF8A80"/>

  <!-- Straw Hat tilted -->
  <g id="straw-hat" transform="translate(42, 28) rotate(-8)">
    <ellipse cx="18" cy="16" rx="22" ry="7" fill="#F4D06F" stroke="#5E432E" stroke-width="2"/>
    <path d="M 6,14 C 6,4 30,4 30,14 Z" fill="#FFEAA7" stroke="#5E432E" stroke-width="2"/>
    <path d="M 6,13 C 6,10 30,10 30,13" fill="none" stroke="#E63946" stroke-width="3"/>
  </g>

  <!-- Focused Eyes Looking Down at Book -->
  <ellipse cx="48" cy="65" rx="4" ry="5" fill="#2C1810"/>
  <circle cx="47" cy="64" r="1.5" fill="#FFFFFF"/>
  <ellipse cx="72" cy="65" rx="4" ry="5" fill="#2C1810"/>
  <circle cx="71" cy="64" r="1.5" fill="#FFFFFF"/>

  <!-- Chubby Cheeks -->
  <ellipse cx="36" cy="70" rx="7" ry="5" fill="#FF80AB" opacity="0.6"/>
  <ellipse cx="84" cy="70" rx="7" ry="5" fill="#FF80AB" opacity="0.6"/>

  <circle cx="60" cy="68" r="2" fill="#E64980"/>
  <path d="M 57,70 Q 60,72 63,70" fill="none" stroke="#5E432E" stroke-width="1.5"/>

  <!-- Miniature Notebook Held in Paws -->
  <g id="notebook" transform="translate(42, 75)">
    <rect x="0" y="5" width="36" height="25" rx="3" fill="#A8DADC" stroke="#457B9D" stroke-width="2"/>
    <rect x="3" y="7" width="30" height="21" fill="#FFFFFF"/>
    <line x1="18" y1="7" x2="18" y2="28" stroke="#457B9D" stroke-width="1.5"/>
    <circle cx="0" cy="16" r="4.5" fill="#FFAAA6" stroke="#5E432E" stroke-width="1.5"/>
    <circle cx="36" cy="16" r="4.5" fill="#FFAAA6" stroke="#5E432E" stroke-width="1.5"/>
  </g>
</svg>
