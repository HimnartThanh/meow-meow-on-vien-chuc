<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <!-- Shadow -->
  <ellipse cx="60" cy="78" rx="46" ry="14" fill="#5C4533" opacity="0.2"/>

  <!-- Squished Mochi Sleeping Body -->
  <ellipse cx="60" cy="62" rx="42" ry="24" fill="#FEEAA8" stroke="#5E432E" stroke-width="2.5"/>
  <ellipse cx="60" cy="68" rx="26" ry="14" fill="#FFFFFF"/>

  <!-- Tiny Ears Flat -->
  <circle cx="28" cy="50" r="8" fill="#B3845C" stroke="#5E432E" stroke-width="2"/>
  <circle cx="28" cy="50" r="4.5" fill="#FF8A80"/>
  <circle cx="92" cy="50" r="8" fill="#B3845C" stroke="#5E432E" stroke-width="2"/>
  <circle cx="92" cy="50" r="4.5" fill="#FF8A80"/>

  <!-- Sleeping Closed Eyes (^^) -->
  <path d="M 44,60 Q 48,55 52,60" fill="none" stroke="#5E432E" stroke-width="2" stroke-linecap="round"/>
  <path d="M 68,60 Q 72,55 76,60" fill="none" stroke="#5E432E" stroke-width="2" stroke-linecap="round"/>

  <!-- Blushing Cheeks -->
  <ellipse cx="38" cy="65" rx="6" ry="4" fill="#FF80AB" opacity="0.6"/>
  <ellipse cx="82" cy="65" rx="6" ry="4" fill="#FF80AB" opacity="0.6"/>

  <circle cx="60" cy="62" r="2" fill="#E64980"/>
  <path d="M 57,65 Q 60,68 63,65" fill="none" stroke="#5E432E" stroke-width="1.5"/>

  <!-- Tiny Feet Tucked -->
  <ellipse cx="40" cy="76" rx="6" ry="4" fill="#FFAAA6" stroke="#5E432E" stroke-width="1.5"/>
  <ellipse cx="80" cy="76" rx="6" ry="4" fill="#FFAAA6" stroke="#5E432E" stroke-width="1.5"/>

  <!-- Straw hat placed gently beside -->
  <g id="hat-aside" transform="translate(15, 60) scale(0.65) rotate(-20)">
    <ellipse cx="18" cy="16" rx="22" ry="7" fill="#F4D06F" stroke="#5E432E" stroke-width="2"/>
    <path d="M 6,14 C 6,4 30,4 30,14 Z" fill="#FFEAA7" stroke="#5E432E" stroke-width="2"/>
  </g>

  <!-- Floating Zzz -->
  <g id="zzz" fill="#FFB703" font-family="'Nunito', sans-serif" font-weight="900">
    <text x="70" y="38" font-size="12" opacity="0.75">z</text>
    <text x="82" y="26" font-size="16" opacity="0.85">Z</text>
    <text x="96" y="14" font-size="20" opacity="0.95">Z</text>
  </g>
</svg>
