<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <!-- Wall & Floor Gradients -->
    <linearGradient id="wallWarm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8EE"/>
      <stop offset="100%" stop-color="#F7EADB"/>
    </linearGradient>
    <linearGradient id="floorWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DEC4"/>
      <stop offset="50%" stop-color="#EAD1B2"/>
      <stop offset="100%" stop-color="#DFBF9E"/>
    </linearGradient>
    <linearGradient id="gardenGrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4EDB8"/>
      <stop offset="60%" stop-color="#C2E5A1"/>
      <stop offset="100%" stop-color="#B0DA8C"/>
    </linearGradient>
    <linearGradient id="wallStripe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBE6D6"/>
      <stop offset="100%" stop-color="#F5D7C2"/>
    </linearGradient>
    <linearGradient id="skyWindow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7EFFE"/>
      <stop offset="100%" stop-color="#B8E3FF"/>
    </linearGradient>
    <linearGradient id="woodGate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C29A78"/>
      <stop offset="50%" stop-color="#D8B595"/>
      <stop offset="100%" stop-color="#B68B66"/>
    </linearGradient>
    
    <!-- Floor Pattern -->
    <pattern id="woodPlanks" width="60" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#D3B491" stroke-width="1.5" opacity="0.6"/>
      <line x1="20" y1="0" x2="20" y2="30" stroke="#D3B491" stroke-width="1" opacity="0.4"/>
      <line x1="50" y1="0" x2="50" y2="30" stroke="#D3B491" stroke-width="1" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- BACKGROUND SKY / HORIZON -->
  <rect width="1000" height="700" fill="#EAF5EE"/>

  <!-- INDOOR WALL (LEFT) -->
  <path d="M 0,0 L 500,0 L 500,380 L 0,260 Z" fill="url(#wallWarm)"/>
  
  <!-- Wall Stripes (Beige & Peach stripes) -->
  <g opacity="0.45">
    <rect x="50" y="0" width="30" height="270" fill="url(#wallStripe)"/>
    <rect x="130" y="0" width="30" height="290" fill="url(#wallStripe)"/>
    <rect x="210" y="0" width="30" height="310" fill="url(#wallStripe)"/>
    <rect x="290" y="0" width="30" height="330" fill="url(#wallStripe)"/>
    <rect x="370" y="0" width="30" height="350" fill="url(#wallStripe)"/>
    <rect x="450" y="0" width="30" height="370" fill="url(#wallStripe)"/>
  </g>

  <!-- ARCHED INDOOR WINDOW (Left Wall) -->
  <g id="arched-window">
    <!-- Outer Arch Frame -->
    <path d="M 80,180 L 80,100 A 70,70 0 0,1 220,100 L 220,180 Z" fill="#75563D" stroke="#5E432E" stroke-width="4"/>
    <path d="M 88,175 L 88,103 A 62,62 0 0,1 212,103 L 212,175 Z" fill="url(#skyWindow)"/>
    <!-- Window Landscape Hills -->
    <circle cx="120" cy="180" r="45" fill="#88D480" opacity="0.8"/>
    <circle cx="180" cy="190" r="55" fill="#69C261" opacity="0.9"/>
    <!-- Window Crossbars -->
    <line x1="150" y1="45" x2="150" y2="175" stroke="#5E432E" stroke-width="4"/>
    <line x1="88" y1="120" x2="212" y2="120" stroke="#5E432E" stroke-width="3"/>
    <!-- Sun Beam Reflection -->
    <path d="M 100,55 L 140,55 L 110,130 L 95,130 Z" fill="#FFFFFF" opacity="0.35"/>
    <!-- Window Sill -->
    <rect x="70" y="180" width="160" height="12" rx="4" fill="#936F52" stroke="#5E432E" stroke-width="2.5"/>
    <rect x="90" y="172" width="24" height="8" rx="2" fill="#FFE5A3"/>
    <!-- Little Flower Pot on Sill -->
    <ellipse cx="180" cy="178" rx="10" ry="4" fill="#E88A8A"/>
    <path d="M 174,178 L 176,168 L 184,168 L 186,178 Z" fill="#FFA5A5" stroke="#5E432E" stroke-width="1.5"/>
    <circle cx="180" cy="164" r="5" fill="#FF708F"/>
    <circle cx="176" cy="165" r="4" fill="#FFA0B8"/>
    <circle cx="184" cy="165" r="4" fill="#FFA0B8"/>
    <circle cx="180" cy="164" r="2.5" fill="#FFF275"/>
  </g>

  <!-- HANGING WALL FRAME -->
  <g id="wall-art">
    <rect x="300" y="80" width="70" height="85" rx="5" fill="#FFF2DE" stroke="#875E3B" stroke-width="4"/>
    <rect x="310" y="90" width="50" height="65" fill="#FFE8ED"/>
    <!-- Little cute art inside -->
    <ellipse cx="335" cy="130" rx="18" ry="14" fill="#F7C59F"/>
    <circle cx="330" cy="125" r="2.5" fill="#5E432E"/>
    <circle cx="340" cy="125" r="2.5" fill="#5E432E"/>
    <ellipse cx="326" cy="129" rx="3.5" ry="2" fill="#FF9EAA"/>
    <ellipse cx="344" cy="129" rx="3.5" ry="2" fill="#FF9EAA"/>
    <path d="M 333,128 Q 335,131 337,128" stroke="#5E432E" stroke-width="1.5" fill="none"/>
    <circle cx="345" cy="102" r="5" fill="#FFD166"/>
  </g>

  <!-- OUTDOOR WALL & WOODEN ARCH GATE (RIGHT) -->
  <path d="M 500,0 L 1000,0 L 1000,260 L 500,380 Z" fill="#DDEFE4"/>
  
  <!-- Big Garden Arched Gate -->
  <g id="garden-gate">
    <!-- Green foliage behind gate -->
    <path d="M 560,0 Q 600,60 640,0 Q 720,70 800,0 Q 880,80 940,0 L 960,180 L 550,180 Z" fill="#9CD896" opacity="0.8"/>
    <path d="M 550,180 L 550,70 A 200,160 0 0,1 950,70 L 950,180 Z" fill="#80B97B" opacity="0.6"/>
    <!-- Arch Frame Wooden Beam -->
    <path d="M 540,195 L 540,65 A 210,175 0 0,1 960,65 L 960,195 Z" fill="none" stroke="#684D35" stroke-width="16" stroke-linecap="round"/>
    <path d="M 540,195 L 540,65 A 210,175 0 0,1 960,65 L 960,195 Z" fill="none" stroke="url(#woodGate)" stroke-width="12" stroke-linecap="round"/>
    <!-- Sun Ray Spoke details on Arch -->
    <line x1="750" y1="65" x2="750" y2="195" stroke="#684D35" stroke-width="5"/>
    <line x1="680" y1="80" x2="750" y2="195" stroke="#684D35" stroke-width="4"/>
    <line x1="820" y1="80" x2="750" y2="195" stroke="#684D35" stroke-width="4"/>
    <line x1="610" y1="120" x2="750" y2="195" stroke="#684D35" stroke-width="4"/>
    <line x1="890" y1="120" x2="750" y2="195" stroke="#684D35" stroke-width="4"/>
    <!-- Gate Solid Wood Lower Half -->
    <path d="M 550,140 L 950,140 L 950,230 L 550,230 Z" fill="url(#woodGate)" stroke="#684D35" stroke-width="4"/>
    <circle cx="735" cy="185" r="5" fill="#F4D35E" stroke="#5E432E" stroke-width="2"/>
    <circle cx="765" cy="185" r="5" fill="#F4D35E" stroke="#5E432E" stroke-width="2"/>
  </g>

  <!-- FLOOR DIVISION: INDOOR WOODEN PARQUET FLOOR (LEFT) -->
  <g id="indoor-floor">
    <path d="M 0,260 L 500,380 L 150,700 L 0,700 Z" fill="url(#floorWood)"/>
    <path d="M 0,260 L 500,380 L 150,700 L 0,700 Z" fill="url(#woodPlanks)"/>
    <!-- Cozy Pink Oval Carpet in Room -->
    <ellipse cx="230" cy="480" rx="140" ry="75" fill="#FFDEE8" stroke="#F4A5BE" stroke-width="4" transform="rotate(-15, 230, 480)"/>
    <ellipse cx="230" cy="480" rx="125" ry="65" fill="#FFEBF1" transform="rotate(-15, 230, 480)"/>
    <!-- Scalloped Carpet Lace Fringe -->
    <ellipse cx="230" cy="480" rx="135" ry="72" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="8,6" transform="rotate(-15, 230, 480)"/>
  </g>

  <!-- FLOOR DIVISION: OUTDOOR GARDEN LAWN (RIGHT) -->
  <g id="outdoor-garden">
    <path d="M 500,380 L 1000,260 L 1000,700 L 150,700 Z" fill="url(#gardenGrass)"/>
    
    <!-- Stone Stepping Pathway in Garden -->
    <g id="stepping-stones" opacity="0.85">
      <ellipse cx="640" cy="420" rx="28" ry="14" fill="#D6E0E2" stroke="#9AB1B7" stroke-width="2.5"/>
      <ellipse cx="710" cy="460" rx="34" ry="16" fill="#E4ECEE" stroke="#9AB1B7" stroke-width="2.5"/>
      <ellipse cx="790" cy="510" rx="36" ry="17" fill="#D6E0E2" stroke="#9AB1B7" stroke-width="2.5"/>
      <ellipse cx="870" cy="570" rx="40" ry="18" fill="#E4ECEE" stroke="#9AB1B7" stroke-width="2.5"/>
      <ellipse cx="730" cy="580" rx="32" ry="15" fill="#D6E0E2" stroke="#9AB1B7" stroke-width="2.5"/>
      <ellipse cx="620" cy="610" rx="30" ry="15" fill="#E4ECEE" stroke="#9AB1B7" stroke-width="2.5"/>
    </g>

    <!-- Little Flower Tufts in Lawn -->
    <g id="garden-flowers">
      <circle cx="580" cy="460" r="5" fill="#FFFFFF"/><circle cx="580" cy="460" r="2.5" fill="#FFD166"/>
      <circle cx="592" cy="470" r="5" fill="#FF9AA2"/><circle cx="592" cy="470" r="2.5" fill="#FFF"/>
      <circle cx="880" cy="430" r="6" fill="#B5EAD7"/><circle cx="880" cy="430" r="2.5" fill="#FFF"/>
      <circle cx="920" cy="620" r="6" fill="#FFDAC1"/><circle cx="920" cy="620" r="2.5" fill="#E27D60"/>
    </g>
  </g>

  <!-- ROOM-GARDEN DIVIDER: WHITE PICKET FENCE & FLOWER BOXES -->
  <g id="divider-fence">
    <!-- Threshold Wood Trim Base -->
    <path d="M 495,378 L 148,698 L 158,705 L 505,385 Z" fill="#8D6343" stroke="#5E432E" stroke-width="2"/>
    <!-- Picket Fence Posts -->
    <!-- Post 1 -->
    <path d="M 450,400 L 450,335 L 456,325 L 462,335 L 462,400 Z" fill="#FFFFFF" stroke="#684D35" stroke-width="2.5"/>
    <!-- Post 2 -->
    <path d="M 400,445 L 400,380 L 406,370 L 412,380 L 412,445 Z" fill="#FFFFFF" stroke="#684D35" stroke-width="2.5"/>
    <!-- Post 3 -->
    <path d="M 350,490 L 350,425 L 356,415 L 362,425 L 362,490 Z" fill="#FFFFFF" stroke="#684D35" stroke-width="2.5"/>
    <!-- Post 4 -->
    <path d="M 300,535 L 300,470 L 306,460 L 312,470 L 312,535 Z" fill="#FFFFFF" stroke="#684D35" stroke-width="2.5"/>
    <!-- Post 5 -->
    <path d="M 250,580 L 250,515 L 256,505 L 262,515 L 262,580 Z" fill="#FFFFFF" stroke="#684D35" stroke-width="2.5"/>
    <!-- Fence Horizontal Rails -->
    <line x1="462" y1="360" x2="250" y2="550" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <line x1="462" y1="360" x2="250" y2="550" stroke="#684D35" stroke-width="1.5" stroke-dasharray="2 12"/>
    <line x1="462" y1="385" x2="250" y2="575" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- CORNER PILLAR / ROOM BORDER -->
  <line x1="500" y1="0" x2="500" y2="380" stroke="#C5A487" stroke-width="5"/>
</svg>
