<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <!-- Soft Drop Shadow -->
  <ellipse cx="100" cy="135" rx="85" ry="22" fill="#5C4533" opacity="0.18"/>
  
  <!-- Backrest Left Side (Isometric angle) -->
  <path d="M 25,75 L 85,40 L 175,85 L 115,120 Z" fill="#E8C766"/>
  <path d="M 25,45 L 85,15 L 175,60 L 115,90 Z" fill="#FCE588" stroke="#684D35" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 25,45 L 25,75 L 115,120 L 115,90 Z" fill="#E2BD55" stroke="#684D35" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 175,60 L 175,90 L 115,120 L 115,90 Z" fill="#D3A740" stroke="#684D35" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Armrest Left -->
  <g id="armrest-left">
    <path d="M 15,65 L 45,50 L 55,75 L 25,90 Z" fill="#FFF0A5" stroke="#684D35" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 15,65 L 25,90 L 25,115 L 15,90 Z" fill="#E5C35E" stroke="#684D35" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Cushions (Soft bouncy seat) -->
  <path d="M 35,70 L 95,40 L 165,75 L 105,105 Z" fill="#FFF2AC" stroke="#684D35" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 35,70 L 105,105 L 105,122 L 35,87 Z" fill="#F0CD63" stroke="#684D35" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 105,105 L 165,75 L 165,92 L 105,122 Z" fill="#DEB249" stroke="#684D35" stroke-width="3" stroke-linejoin="round"/>

  <!-- Throw Pillow (Chocolate Brown) -->
  <g id="pillow" transform="translate(60, 50)">
    <path d="M 10,15 Q 25,5 40,15 Q 48,28 38,40 Q 22,48 10,38 Q 2,25 10,15 Z" fill="#7A4926" stroke="#4A2810" stroke-width="2.5"/>
    <path d="M 14,18 Q 25,12 36,18 Q 42,28 34,36 Q 22,42 14,34 Q 8,24 14,18 Z" fill="#8D5731"/>
    <!-- Cute star stitch -->
    <circle cx="25" cy="27" r="3" fill="#F8E5B9"/>
  </g>

  <!-- Little Wooden Feet -->
  <path d="M 36,87 L 36,98 L 42,98 L 42,87 Z" fill="#875E3B" stroke="#4A2810" stroke-width="1.5"/>
  <path d="M 103,122 L 103,133 L 109,133 L 109,122 Z" fill="#875E3B" stroke="#4A2810" stroke-width="1.5"/>
  <path d="M 160,92 L 160,103 L 166,103 L 166,92 Z" fill="#875E3B" stroke="#4A2810" stroke-width="1.5"/>
</svg>
