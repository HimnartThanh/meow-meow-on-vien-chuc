<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 160" width="100%" height="100%">
  <!-- Shadow -->
  <ellipse cx="90" cy="135" rx="70" ry="20" fill="#5C4533" opacity="0.18"/>

  <!-- Wooden Desk Legs -->
  <line x1="25" y1="85" x2="25" y2="125" stroke="#754F32" stroke-width="5" stroke-linecap="round"/>
  <line x1="85" y1="120" x2="85" y2="148" stroke="#875E3B" stroke-width="5" stroke-linecap="round"/>
  <line x1="155" y1="80" x2="155" y2="120" stroke="#754F32" stroke-width="5" stroke-linecap="round"/>
  <line x1="95" y1="52" x2="95" y2="90" stroke="#68452B" stroke-width="4" stroke-linecap="round"/>

  <!-- Desk Drawer Unit on Right -->
  <path d="M 105,75 L 155,50 L 155,105 L 105,130 Z" fill="#D3A779" stroke="#5E432E" stroke-width="2.5"/>
  <line x1="105" y1="92" x2="155" y2="67" stroke="#5E432E" stroke-width="2"/>
  <line x1="105" y1="110" x2="155" y2="85" stroke="#5E432E" stroke-width="2"/>
  <!-- Drawer Handles -->
  <circle cx="128" cy="81" r="3" fill="#FFE5A3" stroke="#5E432E" stroke-width="1.5"/>
  <circle cx="128" cy="99" r="3" fill="#FFE5A3" stroke="#5E432E" stroke-width="1.5"/>
  <circle cx="128" cy="118" r="3" fill="#FFE5A3" stroke="#5E432E" stroke-width="1.5"/>

  <!-- Desktop Surface (Isometric Top) -->
  <path d="M 20,60 L 95,20 L 165,55 L 90,95 Z" fill="#FFF2DE" stroke="#5E432E" stroke-width="3"/>
  <!-- Desktop Edge Thickness -->
  <path d="M 20,60 L 90,95 L 90,103 L 20,68 Z" fill="#E6C4A2" stroke="#5E432E" stroke-width="2.5"/>
  <path d="M 90,95 L 165,55 L 165,63 L 90,103 Z" fill="#C99C75" stroke="#5E432E" stroke-width="2.5"/>

  <!-- Items on Desk: Laptop / Open Book -->
  <g id="study-book" transform="translate(48, 48)">
    <path d="M 5,12 L 25,2 L 42,10 L 22,20 Z" fill="#FFFFFF" stroke="#3F51B5" stroke-width="1.5"/>
    <path d="M 22,20 L 25,2" stroke="#3F51B5" stroke-width="1.5"/>
    <path d="M 8,11 L 20,17" stroke="#9FA8DA" stroke-width="1"/>
    <path d="M 10,9 L 21,14" stroke="#9FA8DA" stroke-width="1"/>
    <path d="M 27,5 L 39,11" stroke="#9FA8DA" stroke-width="1"/>
    <path d="M 28,8 L 38,13" stroke="#9FA8DA" stroke-width="1"/>
  </g>

  <!-- Cute Pink Desk Lamp -->
  <g id="desk-lamp" transform="translate(100, 25)">
    <ellipse cx="20" cy="22" rx="10" ry="5" fill="#F48FB1" stroke="#5E432E" stroke-width="1.5"/>
    <path d="M 20,20 Q 25,5 15,2" fill="none" stroke="#5E432E" stroke-width="2.5"/>
    <path d="M 10,5 Q 16,-2 22,4 Z" fill="#FF80AB" stroke="#5E432E" stroke-width="2"/>
    <circle cx="16" cy="4" r="2.5" fill="#FFF59D"/>
  </g>

  <!-- Pencil Cup with Pens -->
  <g id="pencil-cup" transform="translate(35, 38)">
    <path d="M 4,14 L 12,10 L 12,20 L 4,24 Z" fill="#80DEEA" stroke="#5E432E" stroke-width="1.5"/>
    <line x1="8" y1="12" x2="6" y2="2" stroke="#FF5252" stroke-width="2"/>
    <line x1="10" y1="11" x2="12" y2="4" stroke="#4CAF50" stroke-width="2"/>
  </g>
</svg>
