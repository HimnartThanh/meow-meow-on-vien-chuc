  <path d="M 60,55 L 75,64 L 30,135 L 15,126 Z" fill="#4FC3F7" stroke="#0288D1" stroke-width="2.5"/>
  <!-- Slide Bed -->
  <path d="M 75,64 L 92,74 L 47,145 L 30,135 Z" fill="#81D4FA" stroke="#0288D1" stroke-width="2.5"/>
  <!-- Slide Side Rail Right -->
  <path d="M 92,74 L 102,80 L 57,151 L 47,145 Z" fill="#29B6F6" stroke="#0288D1" stroke-width="2.5"/>
  <!-- Slide Exit Flap on Grass -->
  <path d="M 30,135 L 47,145 L 35,152 L 18,142 Z" fill="#B3E5FC" stroke="#0288D1" stroke-width="2"/>
</svg>
