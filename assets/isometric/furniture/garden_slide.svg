<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="100%" height="100%">
  <!-- Shadow -->
  <ellipse cx="80" cy="148" rx="65" ry="18" fill="#5C4533" opacity="0.18"/>

  <!-- Wooden Climbing Platform / Cubby Box Base -->
  <path d="M 90,70 L 145,40 L 145,115 L 90,145 Z" fill="#DDBB98" stroke="#5E432E" stroke-width="2.5"/>
  <path d="M 90,70 L 145,40 L 115,22 L 60,52 Z" fill="#F7EADB" stroke="#5E432E" stroke-width="2.5"/>
  <path d="M 60,52 L 90,70 L 90,145 L 60,127 Z" fill="#C99C75" stroke="#5E432E" stroke-width="2.5"/>

  <!-- Platform House Roof / Arch -->
