  <circle cx="115" cy="40" r="3.5" fill="#FFE5A3" stroke="#5E432E" stroke-width="1"/>
  <circle cx="125" cy="45" r="3.5" fill="#FFE5A3" stroke="#5E432E" stroke-width="1"/>

  <!-- Cubby Hole Openings (like in video) -->
  <ellipse cx="118" cy="85" rx="14" ry="18" fill="#754F32"/>
  <ellipse cx="118" cy="83" rx="12" ry="15" fill="#422C1B"/>

  <!-- Slide Chute (Pastel Blue Slide from video) -->
