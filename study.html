<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ôn Bài — Meow Meow Ôn Viên Chức</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root {
      --pink-light: #FFE4EE;
      --pink-main: #FF85A1;
      --pink-deep: #E85D8A;
      --pink-pastel: #FFB6C1;
      --purple-soft: #C9A8E0;
      --purple-light: #EFE6F8;
      --green-main: #6BCB77;
      --red-main: #FF6B6B;
      --yellow-main: #FFD93D;
      --blue-main: #4D96FF;
      --text-dark: #3D2B3D;
      --text-mid: #7A5C7A;
      --text-light: #B89EB8;
      --white: #FFFFFF;
      --radius: 20px;
      --radius-sm: 12px;
      --shadow: 0 4px 20px rgba(255, 133, 161, 0.2);
      --font: 'Nunito', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font), system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #FFF0F5 0%, #FFE4EE 50%, #F5E6FA 100%);
      color: var(--text-dark);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 10px rgba(255, 133, 161, 0.15);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--pink-light);
      color: var(--pink-deep);
      text-decoration: none;
      font-weight: 700;
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
    }

    .nav-back:hover {
      background: var(--pink-main);
      color: var(--white);
      transform: translateY(-1px);
    }

    .page-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--pink-deep);
    }

    .hud-badges {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hud-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      background: var(--white);
      border: 2px solid var(--pink-light);
      border-radius: var(--radius-sm);
      font-weight: 800;
      font-size: 0.9rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .study-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Review Today Priority Card */
    .priority-card {
      background: linear-gradient(135deg, #FFF5F8 0%, #FFFFFF 100%);
      border: 2px solid var(--pink-main);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .priority-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .priority-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--pink-deep);
    }

    .priority-count-badge {
      background: var(--pink-main);
      color: var(--white);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 800;
    }

    .priority-desc {
      font-size: 0.95rem;
      color: var(--text-mid);
      line-height: 1.4;
    }

    .priority-actions {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .btn-priority {
      background: linear-gradient(135deg, var(--pink-main) 0%, var(--pink-deep) 100%);
      color: var(--white);
      border: none;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(232, 93, 138, 0.3);
    }

    .btn-priority:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(232, 93, 138, 0.4);
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Topic Cards Grid */
    .topic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 18px;
    }

    .topic-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      border: 2px solid rgba(255, 182, 193, 0.4);
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .topic-card:hover {
      transform: translateY(-3px);
      border-color: var(--pink-main);
      box-shadow: 0 8px 24px rgba(255, 133, 161, 0.3);
    }

    .topic-top {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .topic-icon {
      font-size: 2.2rem;
      background: var(--pink-light);
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      flex-shrink: 0;
    }

    .topic-info {
      flex: 1;
    }

    .topic-name {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 4px;
    }

    .topic-desc {
      font-size: 0.85rem;
      color: var(--text-mid);
      line-height: 1.4;
    }

    .progress-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #FAFAFA;
      padding: 12px;
      border-radius: var(--radius-sm);
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-mid);
    }

    .progress-bar-container {
      width: 100%;
      height: 10px;
      background: #E8E8E8;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
    }

    .bar-seg {
      height: 100%;
      transition: width 0.3s ease;
    }
    .bar-mastered { background: var(--green-main); }
    .bar-learning { background: var(--yellow-main); }
    .bar-review { background: #FF9F45; }
    .bar-new { background: var(--blue-main); }

    .progress-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .btn-study-topic {
      background: var(--pink-main);
      color: var(--white);
      border: none;
      padding: 12px;
      border-radius: var(--radius-sm);
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .btn-study-topic:hover {
      background: var(--pink-deep);
    }

    /* Mode Picker Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-card {
      background: var(--white);
      border-radius: var(--radius);
      max-width: 480px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      border: 3px solid var(--pink-light);
      display: flex;
      flex-direction: column;
      gap: 18px;
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--pink-deep);
    }

    .btn-close-modal {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--text-light);
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }

    .btn-close-modal:hover {
      color: var(--pink-deep);
    }

    .modes-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mode-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: #FFF5F8;
      border: 2px solid var(--pink-light);
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--text-dark);
      transition: all 0.2s ease;
    }

    .mode-btn:hover {
      background: var(--pink-light);
      border-color: var(--pink-main);
      transform: translateX(4px);
    }

    .mode-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mode-icon {
      font-size: 1.8rem;
    }

    .mode-texts {
      text-align: left;
    }

    .mode-name {
      font-weight: 800;
      font-size: 1rem;
      color: var(--text-dark);
    }

    .mode-sub {
      font-size: 0.8rem;
      color: var(--text-mid);
    }

    .mode-reward {
      background: var(--white);
      color: var(--pink-deep);
      font-weight: 800;
      font-size: 0.85rem;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid var(--pink-pastel);
    }

    @media (max-width: 480px) {
      .study-container {
        padding: 14px;
      }
      .topic-grid {
        grid-template-columns: 1fr;
      }
      .priority-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <header class="top-nav">
    <a href="index.html" class="nav-back">← Trang Chủ</a>
    <h1 class="page-title">📚 Ôn Bài</h1>
    <div class="hud-badges">
      <span class="hud-badge hud-stars">⭐ <span id="stars-count">0</span></span>
      <span class="hud-badge hud-streak">🔥 <span id="streak-count">0</span></span>
    </div>
  </header>

  <main class="study-container">
    <!-- Cần Ôn Hôm Nay (Priority Section) -->
    <section class="priority-card" id="priority-section">
      <div class="priority-header">
        <div class="priority-title">
          <span>⏰ Cần Ôn Hôm Nay</span>
          <span class="priority-count-badge" id="priority-total-badge">0 câu</span>
        </div>
      </div>
      <p class="priority-desc" id="priority-desc-text">
        Hệ thống ôn tập ngắt quãng (Spaced Repetition) tự động nhắc bạn ôn lại những câu đến hạn hôm nay để ghi nhớ lâu dài!
      </p>
      <div class="priority-actions" id="priority-actions">
        <button type="button" class="btn-priority" id="btn-quick-review">⚡ Ôn Tập Ngay</button>
      </div>
    </section>

    <!-- Danh sách chủ đề -->
    <section class="topic-section">
      <h2 class="section-title">Chủ Đề Ôn Luyện</h2>
      <div class="topic-grid" id="topic-grid">
        <!-- Topic cards rendered dynamically via js/study.js -->
      </div>
    </section>
  </main>

  <!-- Mode Picker Modal -->
  <div class="modal-overlay" id="mode-modal" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-topic-title">Chọn Chế Độ Học</h3>
        <button type="button" class="btn-close-modal" id="btn-close-modal">✕</button>
      </div>
      <p id="modal-topic-desc" style="font-size: 0.9rem; color: var(--text-mid);"></p>
      <div class="modes-list" id="modal-modes-container">
        <!-- Mode links dynamically rendered with ?topic={topicId} -->
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
  <script src="js/study.js"></script>
</body>
</html>
